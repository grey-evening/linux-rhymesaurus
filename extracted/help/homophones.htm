<p><span style="font-weight: bold;">Homophones</span></p>
<p>Homophones are words that sound exactly alike.&nbsp; For example, &quot;rain,&quot; &quot;rein,&quot; and &quot;reign&quot; are all homophones.&nbsp; Selecting Homophones in the rhyming dictionary will give you all the words that are pronounced the same as the search word.</p>
