<p><span style="font-weight: bold;">Elided Rhymes</span></p>
<p>Elided rhymes are word pairs where one word would be a perfect rhyme for the other if the other word had it's final vowel sound removed.&nbsp; This removal of the final vowel sound is known as &quot;elision&quot;.&nbsp; Examples of elided rhymes are vivid/lived, fervid/curved, etc.</p>
