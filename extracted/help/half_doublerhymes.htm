<p><span style="font-weight: bold;">Half-double Rhymes</span></p>
<p>Half-double rhymes are pairs of words where the stressed final syllable of one word rhymes with the stressed penultimate syllable of another (e.g., back/cracker, ride/confided, etc.</p>
