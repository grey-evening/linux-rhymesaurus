<p><span style="font-weight: bold;">Assonance</span></p>
<p>The Assonance feature of the rhyming dictionary shows you all words the contain the same final vowel sound (e.g., attack/hat).</p>
<p>&nbsp;</p>
<p><span style="font-weight: bold;">Note:</span> This feature matches the vowel <span style="font-style: italic;">sounds</span>, not the exact letters.</p>
